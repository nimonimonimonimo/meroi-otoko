<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メロい男・選択型ノベル診断</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #f0f0f0;
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2em;
    }
    #container {
      max-width: 600px;
      background: #2a2a2a;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
    }
    #scene {
      font-size: 1.2em;
      margin-bottom: 1em;
      line-height: 1.8;
    }
    .choice {
      background: #333;
      color: #fff;
      padding: 1em;
      margin: 0.5em 0;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .choice:hover {
      background: #ff8dc7;
      color: #000;
    }
    #result {
      font-size: 1.4em;
      margin-top: 2em;
      color: #ff8dc7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="scene"></div>
    <div id="choices"></div>
    <div id="result"></div>
  </div>

  <script>
    const story = [
      {
        text: "\n\n── メロい男・選択型診断 ──\n\n\n君は気づいていない。\nその一言が、\nその返信が、\n誰かの一日を占領していることに。\n\n選択を間違えればすべてが終わる。\nでも最後までたどり着けたとき、\n君は “完全沼らせメロ男” になる──。",
        choices: [
          { text: "診断をはじめる", next: 1 }
        ]
      },
      {
        text: "深夜0時、スマホを眺めながら『起きてる？』と打っては消す。",
        choices: [
          { text: "何も言わずにストーリーだけ更新する。", next: 2 },
          { text: "素直に『起きてる？』と送る。", badEnd: "それはもうアプローチ。君は“メロ男”じゃなかった。" }
        ]
      },
      {
        text: "数分後、DMが来た。『ストーリー、いまの？』",
        choices: [
          { text: "『ちがうかも』って濁す。", next: 3 },
          { text: "『そうだよ』って答える。", badEnd: "“確信”を渡した時点で恋は終わる。" }
        ]
      },
      {
        text: "通話が始まった。ゆるく喋ってるうちに、沈黙が心地よくなる。",
        choices: [
          { text: "眠くなったけど、そのまま繋げておく。", next: 4 },
          { text: "『ねむ…』ってだけ言って落ちる。", badEnd: "沈黙のあとに無音が来たら、心も切れる。" }
        ]
      },
      {
        text: "翌朝、昨日の帰り道の写真をストーリーに上げようとする。",
        choices: [
          { text: "壁だけ写ったやつにする。", next: 5 },
          { text: "誰が写ってるかも分かる写真を使う。", badEnd: "“他の誰か”が見えた瞬間、君は脳内から外れる。" }
        ]
      },
      {
        text: "『あの場所、雰囲気よかったね』ってDMが来る。",
        choices: [
          { text: "『夢に出てきそうだった』ってだけ返す。", next: 6 },
          { text: "『また行きたいね』と返す。", badEnd: "その言葉は、誰にでも使える。" }
        ]
      },
      {
        text: "『夢に出てきそうだった』に『なんで？』って返された。",
        choices: [
          { text: "既読をつけてしばらく放っておく。", next: 7 },
          { text: "すぐに理由を説明する。", badEnd: "説明した時点で、それは夢ではなくなる。" }
        ]
      },
      {
        text: "朝になって、なんとなくストーリーを開く。",
        choices: [
          { text: "『変な夢見た気がする』ってだけ投稿する。", ending: "🫖 君は完全沼らせメロ男。\nそのストーリーは、誰かのスクショに残る。" },
          { text: "何も投稿しないで一日を始める。", badEnd: "沈黙は美しい。でも、なにも届かない。" }
        ]
      }
    ];

    let sceneIndex = 0;

    function renderScene() {
      const s = story[sceneIndex];
      document.getElementById("scene").innerText = s.text;
      const choices = document.getElementById("choices");
      const result = document.getElementById("result");
      result.innerHTML = "";
      choices.innerHTML = "";
      s.choices.forEach(choice => {
        const btn = document.createElement("div");
        btn.className = "choice";
        btn.innerText = choice.text;
        btn.onclick = () => {
          if (choice.next !== undefined) {
            sceneIndex = choice.next;
            renderScene();
          } else if (choice.badEnd) {
            document.getElementById("scene").innerText = "\n── BAD END ──\n";
            choices.innerHTML = "";
            result.innerText = choice.badEnd;
          } else if (choice.ending) {
            document.getElementById("scene").innerText = "\n── FINAL ──\n";
            choices.innerHTML = "";
            result.innerText = choice.ending;
          }
        };
        choices.appendChild(btn);
      });
    }

    renderScene();
  </script>
</body>
</html>
