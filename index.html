
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メロい男サバイバルゲーム</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap');
    body {
      background-color: #1a1a1a;
      color: #f0f0f0;
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2em;
      margin: 0;
    }
    #container {
      width: 100%;
      max-width: 480px;
      background: #2a2a2a;
      padding: 2em 1.5em;
      border-radius: 16px;
      box-shadow:
    0 0 30px rgba(255, 105, 180, 0.25),
    0 0 60px rgba(255, 182, 193, 0.2),
    0 0 90px rgba(255, 105, 180, 0.15);
      box-sizing: border-box;
    }
    #scene {
      font-size: 1.1em;
      margin-bottom: 1.5em;
      line-height: 1.7;
      text-align: center;
    }
    .choice {
      background: #333;
      color: #fff;
      padding: 0.9em 1em;
      margin: 0.6em auto;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .choice:hover {
      background: #ffb3d9;
      color: #000;
    }
    #result {
      font-size: 1.3em;
      margin-top: 2em;
      color: #ffb3d9;
      text-align: center;
      white-space: pre-line;
    }
    #shareButton {
      margin-top: 1.5em;
      background: #1da1f2;
      color: white;
      padding: 0.8em 1.2em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1em;
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    #loading {
      font-size: 1.2em;
      color: #ccc;
      margin-bottom: 2em;
      text-align: center;
    }
    #popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffb3d9;
      color: #1a1a1a;
      padding: 1em 1.5em;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
      z-index: 999;
      font-weight: bold;
      font-size: 1.1em;
      display: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">ローディング中…</div>
    <div id="scene" style="display:none;"></div>
    <div id="choices"></div>
    <div id="result"></div>
    <button id="shareButton" style="display: none;">X（旧Twitter）で診断結果をシェア</button>
  </div>
  <div id="popup">✓ クリア！</div>

  <script>
    const badEndTexts = {
      1: "『起きてる？』が直球すぎた。余白を読ませる時間を、君は自分で閉じた。",
      2: "『そうだよ』って言葉、うれしいけど、答え合わせされた時点で恋は止まる。",
      3: "眠くなって先に落ちたら、沈黙の魔法が解けてしまうんだよ。",
      4: "その写真、“誰か”が見えた時点で、私はスクリーンの外に追い出された。",
      5: "『また行こう』はうれしい。でもそれ、誰にでも言えるよね？",
      6: "説明してしまったら、それは夢じゃなくなるの。全部“現実”になってしまう。",
      7: "なにも言わずに静かな朝をくれたら…まだ少し夢の中にいられたのに。"
    };

    const story = [
      {
        text: "\n\n── メロい男・選択型診断 ──\n\n\n君は気づいていない。\nその一言が、\nその返信が、\n誰かの一日を占領していることに。\n\n選択を間違えればすべてが終わる。\nでも最後までたどり着けたとき、\n君は “完全沼らせメロ男” になる──。",
        choices: [
          { text: "診断をはじめる", next: 1 }
        ]
      },
      {
        text: "深夜0時、スマホを眺めながら『起きてる？』と打っては消す。",
        choices: [
          { text: "何も言わずにストーリーだけ更新する。", next: 2 },
          { text: "素直に『起きてる？』と送る。", badReason: 1 }
        ]
      },
      {
        text: "数分後、DMが来た。『ストーリー、いまの？』",
        choices: [
          { text: "『ちがうかも』って濁す。", next: 3 },
          { text: "『そうだよ』って答える。", badReason: 2 }
        ]
      },
      {
        text: "通話が始まった。ゆるく喋ってるうちに、沈黙が心地よくなる。",
        choices: [
          { text: "眠くなったけど、そのまま繋げておく。", next: 4 },
          { text: "『ねむ…』ってだけ言って落ちる。", badReason: 3 }
        ]
      },
      {
        text: "翌朝、昨日の帰り道の写真をストーリーに上げようとする。",
        choices: [
          { text: "壁だけ、光だけ写ったやつにする。", next: 5 },
          { text: "誰が写ってるかも分かる写真を使う。", badReason: 4 }
        ]
      },
      {
        text: "『あの場所、雰囲気よかったね』ってDMが来る。",
        choices: [
          { text: "『夢に出てきそうだった』ってだけ返す。", next: 6 },
          { text: "『また行きたいね』と返す。", badReason: 5 }
        ]
      },
      {
        text: "『夢に出てきそうだった』に『なんで？』って返された。",
        choices: [
          { text: "既読をつけてしばらく放っておく。", next: 7 },
          { text: "すぐに理由を説明する。", badReason: 6 }
        ]
      },
      {
        text: "朝になって、なんとなくストーリーを開く。",
        choices: [
          { text: "『変な夢見た気がする』ってだけ投稿する。", ending: "🫖 君は完全沼らせメロ男。\nそのストーリーは、誰かのスクショに残る。" },
          { text: "何も投稿しないで一日を始める。", badReason: 7 }
        ]
      }
    ];

    let sceneIndex = 0;

    function showPopup(text) {
      const popup = document.getElementById("popup");
      popup.innerText = text;
      popup.style.display = "block";
      setTimeout(() => {
        popup.style.display = "none";
      }, 1200);
    }

    function renderScene() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("scene").style.display = "block";

      const s = story[sceneIndex];
      document.getElementById("scene").innerText = s.text;
      const choices = document.getElementById("choices");
      const result = document.getElementById("result");
      const share = document.getElementById("shareButton");
      result.innerHTML = "";
      choices.innerHTML = "";
      share.style.display = "none";

      s.choices.forEach(choice => {
        const btn = document.createElement("div");
        btn.className = "choice";
        btn.innerText = choice.text;
        btn.onclick = () => {
          if (choice.next !== undefined) {
            if (sceneIndex !== 0) showPopup("✓ クリア！");
            sceneIndex = choice.next;
            setTimeout(renderScene, 500);
          } else if (choice.badReason) {
            document.getElementById("scene").innerText = "\n── BAD END ──\n";
            choices.innerHTML = "";
            result.innerText = badEndTexts[choice.badReason];
            share.style.display = "inline-block";
            share.onclick = () => {
              const text = encodeURIComponent(`メロい男診断やってみたらBAD ENDだった… #メロ男 #診断ゲーム\nhttps://nimonimonimonimo.github.io/meroi-otoko/`);
              window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
            };
          } else if (choice.ending) {
            document.getElementById("scene").innerText = "\n── FINAL ──\n";
            choices.innerHTML = "";
            result.innerText = choice.ending + `

君は言葉で愛を語らない。表情でも約束しない。
でも、すべての行動が彼女の心を撫でている。

そのやさしさは無自覚かもしれない。
だけど彼女はもう、君のスクリーンの向こう側で
君の“余白”をずっと読み取ってる。

おめでとう。君は完全沼らせメロ男、
誰かの脳内劇場の主演になった。`;
            share.style.display = "inline-block";
            share.onclick = () => {
              const text = encodeURIComponent(`メロい男診断、完全沼らせメロ男に到達した🫖 #メロ男 #診断ゲーム\nhttps://nimonimonimonimo.github.io/meroi-otoko/`);
              window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
            };
          }
        };
        choices.appendChild(btn);
      });
    }

    setTimeout(renderScene, 1500);
  </script>
</body>
</html>
